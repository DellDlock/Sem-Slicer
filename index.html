<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D-пространство — проверка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f4;
    --panel: #ffffff;
    --text: #1b2430;
    --muted: #5b6676;
    --border: #d4dae2;
    --button: #f3f5f8;
    --button-hover: #e4e9ef;
    --focus: #1f7a7a;
    --scene-bg: #dfe4ea;
    --bed: #c9a24b;
    --grid-minor: #b38c3a;
    --grid-major: #7d5f22;
    --cube: #1f8a8a;
    --warn: #d9822b;
    --edge: #0d3f3f;
    --ok: #1f7a4a;
    --error: #b3261e;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161b22;
      --panel: #1e252e;
      --text: #e3e8ee;
      --muted: #98a3b1;
      --border: #2f3843;
      --button: #26303b;
      --button-hover: #313d4a;
      --focus: #5cc8c8;
      --scene-bg: #11161c;
      --bed: #6e5a2c;
      --grid-minor: #8a7139;
      --grid-major: #c9a24b;
      --cube: #2fb3b3;
      --warn: #e8a33d;
      --edge: #bff0f0;
      --ok: #5ccf8e;
      --error: #ff8a80;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161b22;
    --panel: #1e252e;
    --text: #e3e8ee;
    --muted: #98a3b1;
    --border: #2f3843;
    --button: #26303b;
    --button-hover: #313d4a;
    --focus: #5cc8c8;
    --scene-bg: #11161c;
    --bed: #6e5a2c;
    --grid-minor: #8a7139;
    --grid-major: #c9a24b;
    --cube: #2fb3b3;
    --warn: #e8a33d;
    --edge: #bff0f0;
    --ok: #5ccf8e;
    --error: #ff8a80;
    color-scheme: dark;
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%;
    margin: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.4;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 16px; font-weight: 600; margin: 0; margin-right: auto; }
  .group { display: flex; flex-wrap: wrap; gap: 6px; }
  button {
    font: inherit;
    font-size: 14px;
    padding: 6px 12px;
    color: var(--text);
    background: var(--button);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: var(--button-hover); }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  #viewport { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  #viewport canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .overlay {
    position: absolute;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    max-width: calc(100% - 24px);
    box-sizing: border-box;
  }
  #info { left: 12px; bottom: 12px; }
  #info dl { margin: 0; display: grid; grid-template-columns: auto auto; gap: 2px 12px; }
  #info dt { color: var(--muted); }
  #info dd { margin: 0; font-variant-numeric: tabular-nums; }
  #obj-actions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  #obj-actions[hidden] { display: none; }
  #obj-actions button { font-size: 12px; padding: 2px 8px; border-radius: 4px; }
  #obj-actions button[aria-pressed="true"] { background: var(--focus); border-color: var(--focus); color: var(--panel); }
  #hint { right: 12px; bottom: 12px; color: var(--muted); max-width: 340px; }
  #status { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #status.ok { color: var(--ok); }
  #status.error { color: var(--error); }
  .lang { display: flex; align-items: center; gap: 4px; color: var(--muted); }
  .lang select {
    font: inherit; font-size: 13px; padding: 3px 6px; max-width: 160px;
    color: var(--text); background: var(--button);
    border: 1px solid var(--border); border-radius: 6px;
  }
  .lang select:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .axis-x { color: #d64541; font-weight: 600; }
  .axis-y { color: #2e9e4f; font-weight: 600; }
  .axis-z { color: #3a6fd8; font-weight: 600; }
  #settings {
    position: absolute; left: 12px; top: 12px;
    display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px;
    max-width: calc(100% - 180px);
  }
  #settings > .overlay { position: static; max-width: none; }
  #bed-panel, #temp-panel { padding: 0; width: 196px; font-size: 12px; border-radius: 6px; }
  #bed-panel summary, #temp-panel summary { padding: 4px 8px; cursor: pointer; font-weight: 600; color: var(--muted); }
  #bed-panel summary:focus-visible, #temp-panel summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
  #bed-panel .fields, #temp-panel .fields { padding: 0 8px 6px; display: grid; gap: 3px; }
  .field { display: flex; align-items: center; gap: 6px; }
  .field label { width: 14px; display: flex; justify-content: center; flex: none; }
  .temp-icon { color: var(--muted); }
  .temp-sub { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
  .field input[type="range"] { flex: 1; min-width: 0; height: 14px; margin: 0; accent-color: var(--focus); }
  .field input[type="number"] {
    width: 52px; font: inherit; font-size: 12px; padding: 1px 4px;
    color: var(--text); background: var(--button);
    border: 1px solid var(--border); border-radius: 4px;
    font-variant-numeric: tabular-nums;
  }
  .field input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .field input.invalid { border-color: var(--error); }
  #add-panel { right: 12px; top: 12px; padding: 0; font-size: 12px; border-radius: 6px; }
  #add-toggle {
    font-size: 12px; font-weight: 600; padding: 4px 10px;
    color: var(--text); background: transparent; border: 0; border-radius: 6px;
  }
  #add-toggle:hover { background: var(--button-hover); }
  #add-menu { list-style: none; margin: 0; padding: 0 4px 4px; display: grid; gap: 1px; }
  #add-menu[hidden] { display: none; }
  #add-menu button {
    width: 100%; text-align: left; font-size: 12px; padding: 4px 8px;
    background: transparent; border: 0; border-radius: 4px;
  }
  #add-menu button:hover { background: var(--button-hover); }
  #add-menu .sep { height: 1px; background: var(--border); margin: 3px 4px; }
  #toast {
    left: 50%; top: 12px; transform: translateX(-50%);
    width: max-content; max-width: min(520px, calc(100% - 24px));
  }
  #toast[hidden], #drop-zone[hidden] { display: none; }
  #toast.error { color: var(--error); border-color: var(--error); }
  #drop-zone {
    position: absolute; inset: 8px; pointer-events: none;
    display: flex; align-items: center; justify-content: center; text-align: center;
    border: 2px dashed var(--focus); border-radius: 10px;
    background: rgba(31, 122, 122, 0.10);
    color: var(--text); font-size: 16px; font-weight: 600; padding: 16px;
  }
  @media (max-width: 640px) {
    #hint { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1 data-i18n="title">3D-пространство</h1>
  <div class="group" role="group" aria-label="Вид">
    <button type="button" data-view="iso" data-i18n="vIso">Изометрия</button>
    <button type="button" data-view="top" data-i18n="vTop">Сверху</button>
    <button type="button" data-view="front" data-i18n="vFront">Спереди</button>
    <button type="button" data-view="side" data-i18n="vSide">Сбоку</button>
    <button type="button" data-view="object" data-i18n="vObject">К объекту</button>
  </div>
  <span id="status">Загрузка…</span>
  <label class="lang" id="lang-label"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="6.3"/><path d="M1.7 8h12.6M8 1.7c1.9 1.8 2.8 3.9 2.8 6.3S9.9 12.5 8 14.3M8 1.7C6.1 3.5 5.2 5.6 5.2 8s.9 4.5 2.8 6.3"/></svg><select id="lang-select"></select></label>
</header>

<main id="viewport">
  <div id="settings">
  <details id="bed-panel" class="overlay" open data-i18n-title="bedTip" title="Ползунок: от 50 до 600 мм. Поле: от 50 до 1000 мм, точность 0,1 мм.">
    <summary id="bed-summary">Стол, мм</summary>
    <div class="fields">
      <div class="field">
        <label for="bed-x-num" class="axis-x">X</label>
        <input type="range" id="bed-x-range" min="50" max="600" step="1" aria-label="Ширина стола (X), ползунок">
        <input type="number" id="bed-x-num" min="50" max="1000" step="0.1" inputmode="decimal" aria-label="Ширина стола (X), мм">
      </div>
      <div class="field">
        <label for="bed-y-num" class="axis-y">Y</label>
        <input type="range" id="bed-y-range" min="50" max="600" step="1" aria-label="Длина стола (Y), ползунок">
        <input type="number" id="bed-y-num" min="50" max="1000" step="0.1" inputmode="decimal" aria-label="Длина стола (Y), мм">
      </div>
    </div>
  </details>
  <details id="temp-panel" class="overlay" open data-i18n-title="tempTip" title="Сопло: от 150 до 300 °C. Стол: от 0 до 120 °C (0 — без нагрева).">
    <summary data-i18n="tempTitle">Температура, °C</summary>
    <div class="fields">
      <div class="field">
        <label for="t-nozzle-num" class="temp-icon" title="Сопло"><svg viewBox="0 0 14 14" width="14" height="14" aria-hidden="true"><rect x="3" y="1" width="8" height="5" rx="1" fill="currentColor"/><path d="M4.5 7h5l-1.6 4.2h-1.8z" fill="currentColor"/><rect x="6.4" y="11.6" width="1.2" height="1.6" fill="currentColor"/></svg></label>
        <input type="range" id="t-nozzle-range" min="150" max="300" step="1" aria-label="Температура сопла, ползунок">
        <input type="number" id="t-nozzle-num" min="150" max="300" step="1" inputmode="numeric" aria-label="Температура сопла, °C">
      </div>
      <div class="field">
        <label for="t-bed-num" class="temp-icon" title="Стол"><svg viewBox="0 0 14 14" width="14" height="14" aria-hidden="true"><rect x="2" y="2" width="10" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></label>
        <input type="range" id="t-bed-range" min="0" max="120" step="1" aria-label="Температура стола, ползунок">
        <input type="number" id="t-bed-num" min="0" max="120" step="1" inputmode="numeric" aria-label="Температура стола, °C">
      </div>
      <p class="temp-sub" data-i18n="firstLayer">Температура первого слоя</p>
      <div class="field">
        <label for="t-nozzle1-num" class="temp-icon" title="Сопло, первый слой"><svg viewBox="0 0 14 14" width="14" height="14" aria-hidden="true"><rect x="3" y="1" width="8" height="5" rx="1" fill="currentColor"/><path d="M4.5 7h5l-1.6 4.2h-1.8z" fill="currentColor"/><rect x="6.4" y="11.6" width="1.2" height="1.6" fill="currentColor"/></svg></label>
        <input type="range" id="t-nozzle1-range" min="150" max="300" step="1" aria-label="Температура сопла на первом слое, ползунок">
        <input type="number" id="t-nozzle1-num" min="150" max="300" step="1" inputmode="numeric" aria-label="Температура сопла на первом слое, °C">
      </div>
      <div class="field">
        <label for="t-bed1-num" class="temp-icon" title="Стол, первый слой"><svg viewBox="0 0 14 14" width="14" height="14" aria-hidden="true"><rect x="2" y="2" width="10" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></label>
        <input type="range" id="t-bed1-range" min="0" max="120" step="1" aria-label="Температура стола на первом слое, ползунок">
        <input type="number" id="t-bed1-num" min="0" max="120" step="1" inputmode="numeric" aria-label="Температура стола на первом слое, °C">
      </div>
    </div>
  </details>
  </div>
  <div id="add-panel" class="overlay">
    <button type="button" id="add-toggle" aria-expanded="false" aria-controls="add-menu">Добавить объект ▾</button>
    <ul id="add-menu" hidden>
      <li><button type="button" data-shape="cube" data-i18n="cube">Куб</button></li>
      <li><button type="button" data-shape="sphere" data-i18n="sphere">Шар</button></li>
      <li><button type="button" data-shape="cylinder" data-i18n="cylinder">Цилиндр</button></li>
      <li><button type="button" data-shape="torus" data-i18n="torus">Тор</button></li>
      <li><button type="button" data-shape="plate" data-i18n="plate">Пластина</button></li>
      <li class="sep" role="separator"></li>
      <li><button type="button" id="open-file" data-i18n="open">Открыть файл…</button></li>
    </ul>
    <input type="file" id="file-input" multiple hidden>
  </div>
  <div id="info" class="overlay">
    <dl>
      <dt data-i18n="bed">Стол</dt><dd id="bed-size">—</dd>
      <dt data-i18n="iObject">Объект</dt><dd id="obj-name">—</dd>
      <dt data-i18n="iSize">Размер</dt><dd id="obj-size">—</dd>
      <dt data-i18n="iPos">Положение</dt><dd id="obj-pos">—</dd>
      <dt data-i18n="iRot">Поворот</dt><dd id="obj-rot">—</dd>
      <dt data-i18n="iScale">Масштаб</dt><dd id="obj-scale">—</dd>
      <dt data-i18n="iTool">Инструмент</dt><dd id="tool">перемещение</dd>
      <dt data-i18n="iAxes">Оси</dt><dd><span class="axis-x">X</span> <span class="axis-y">Y</span> <span class="axis-z">Z</span></dd>
    </dl>
    <div id="obj-actions" hidden>
      <button type="button" data-tool="rotate" aria-pressed="false">Поворот (R)</button>
      <button type="button" data-tool="scale" aria-pressed="false">Масштаб (S)</button>
      <button type="button" id="obj-delete" data-i18n="delete">Удалить</button>
    </div>
  </div>
  <div id="hint" class="overlay"></div>
  <div id="toast" class="overlay" role="status" hidden></div>
  <div id="drop-zone" hidden data-i18n="drop">Отпустите файл, чтобы добавить модель на стол</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/AMFLoader.js"></script>

      var code = String(prefs[i]).toLowerCase().split("-")[0];

// Перевод строки по ключу с подстановкой {значений}; если перевода нет — английский текст
function tr(key, vars) {
  var d = I18N[i18n.lang] || I18N.en;
  var s = d[key] !== undefined ? d[key] : (I18N.en[key] !== undefined ? I18N.en[key] : key);
  if (vars) s = s.replace(/\{(\w+)\}/g, function (m, k) { return vars[k] !== undefined ? vars[k] : m; });

<script>
(function () {
  "use strict";

  var statusEl = document.getElementById("status");
  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = cls || "";
  }

  // Форматы чисел для выбранного языка (цифры всегда латинские)
  var numFmt, intFmt;
  function setNumberFormats() {
    var loc = i18n.lang + "-u-nu-latn";
    try {
      numFmt = new Intl.NumberFormat(loc, { maximumFractionDigits: 2, useGrouping: false });
      intFmt = new Intl.NumberFormat(loc);
    } catch (e) {
      numFmt = intFmt = { format: function (v) { return String(v); } };
    }
  }
  setNumberFormats();

  if (!window.THREE || !THREE.OrbitControls || !THREE.TransformControls) {
    setStatus(tr("errLib"), "error");
    return;
  }

  // Ось Z направлена вверх, как в 3D-принтерах и файлах STL
  THREE.Object3D.DefaultUp.set(0, 0, 1);

  // Параметры стола и тестового объекта (миллиметры)
  var BED_DEFAULT = { x: 220, y: 220 };
  var BED_LIMITS = { min: 50, max: 1000 };
  var BED = loadBed();
  var CENTER = new THREE.Vector3(BED.x / 2, BED.y / 2, 0);

  function isValidSize(v) {
    return typeof v === "number" && isFinite(v) && v >= BED_LIMITS.min && v <= BED_LIMITS.max;
  }
  // Размер стола запоминается в этом браузере
  function loadBed() {
    try {
      var saved = JSON.parse(localStorage.getItem("slicer.bed") || "null");
      if (saved && isValidSize(saved.x) && isValidSize(saved.y)) return { x: saved.x, y: saved.y };
    } catch (e) {}
    return { x: BED_DEFAULT.x, y: BED_DEFAULT.y };
  }
  function saveBed() {
    try { localStorage.setItem("slicer.bed", JSON.stringify(BED)); } catch (e) {}
  }

  var wrap = document.getElementById("viewport");
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true });
  } catch (e) {
    setStatus(tr("errGl"), "error");
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  wrap.insertBefore(renderer.domElement, wrap.firstChild);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(40, 1, 0.5, 5000);
  camera.up.set(0, 0, 1);

  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.12;
  controls.screenSpacePanning = true;
  controls.minDistance = 10;
  controls.maxDistance = 4000;

  // Освещение
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a94a3, 0.75));
  var sun = new THREE.DirectionalLight(0xffffff, 0.65);
  sun.position.set(BED.x * 0.8, -BED.y * 0.4, 300);
  scene.add(sun);
  var fill = new THREE.DirectionalLight(0xffffff, 0.25);
  fill.position.set(-BED.x * 0.5, BED.y * 1.5, 150);
  scene.add(fill);

  // Стол принтера: координаты от (0, 0) до (BED.x, BED.y), как в G-code
  var bedMat = new THREE.MeshStandardMaterial({ roughness: 0.85, metalness: 0.05 });
  var bed = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), bedMat);
  scene.add(bed);

  // Сетка: тонкие линии каждые 10 мм, толстые каждые 50 мм и по краям стола
  function gridGeometry(major) {
    var pts = [];
    function addX(x) { pts.push(x, 0, 0.02, x, BED.y, 0.02); }
    function addY(y) { pts.push(0, y, 0.02, BED.x, y, 0.02); }
    var v;
    for (v = 0; v < BED.x - 1e-6; v += 10) if ((v % 50 === 0) === major) addX(v);
    for (v = 0; v < BED.y - 1e-6; v += 10) if ((v % 50 === 0) === major) addY(v);
    if (major) { addX(BED.x); addY(BED.y); }
    var g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(pts, 3));
    return g;
  }
  var minorMat = new THREE.LineBasicMaterial();
  var majorMat = new THREE.LineBasicMaterial();
  var minorGrid = new THREE.LineSegments(new THREE.BufferGeometry(), minorMat);
  var majorGrid = new THREE.LineSegments(new THREE.BufferGeometry(), majorMat);
  scene.add(minorGrid);
  scene.add(majorGrid);

  // Перестроение стола и сетки под текущий размер
  function rebuildBed() {
    bed.scale.set(BED.x, BED.y, 1);
    bed.position.set(BED.x / 2, BED.y / 2, -0.05);
    minorGrid.geometry.dispose();
    minorGrid.geometry = gridGeometry(false);
    majorGrid.geometry.dispose();
    majorGrid.geometry = gridGeometry(true);
    CENTER.set(BED.x / 2, BED.y / 2, 0);
  }
  rebuildBed();

  // Оси в начале координат стола
  var AX = 30;
  scene.add(new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 0, 0.05), AX, 0xd64541, 6, 3));
  scene.add(new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 0.05), AX, 0x2e9e4f, 6, 3));
  scene.add(new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0, 0.05), AX, 0x3a6fd8, 6, 3));

  // Простые объекты: появляются в центре стола и стоят на нём (размеры в мм)
  // Двусторонний материал: объект виден и выбирается кликом, даже если камера оказалась внутри него
  // или у модели часть граней развёрнута неправильно
  var objMat = new THREE.MeshStandardMaterial({ roughness: 0.5, metalness: 0.05, side: THREE.DoubleSide });
  // Цвет объекта, который выходит за края стола
  var warnMat = new THREE.MeshStandardMaterial({ roughness: 0.5, metalness: 0.05, side: THREE.DoubleSide });
  var edgeMat = new THREE.LineBasicMaterial();
  var objects = [];
  var active = null; // выделенный объект
  var SHAPES = {
    cube:     { make: function () { return new THREE.BoxGeometry(20, 20, 20); } },
    sphere:   { make: function () { return new THREE.SphereGeometry(10, 48, 32); } },
    cylinder: { make: function () { return new THREE.CylinderGeometry(10, 10, 20, 64).rotateX(Math.PI / 2); } },
    torus:    { make: function () { return new THREE.TorusGeometry(15, 5, 32, 96); } },
    plate:    { make: function () { return new THREE.BoxGeometry(40, 40, 2); } }
  };
  // Красный контур выделения: чуть расширенная копия объекта, видна только изнутри (обратные грани).
  // Толщина пересчитывается каждый кадр от расстояния до камеры, поэтому на экране она постоянная.
  var hullWidth = { value: 1 };
  var hullScale = { value: new THREE.Vector3(1, 1, 1) }; // компенсация масштаба объекта, чтобы контур не растягивался
  var hullMat = new THREE.MeshBasicMaterial({ color: 0xe53935, side: THREE.BackSide });
  hullMat.onBeforeCompile = function (shader) {
    shader.uniforms.outlineWidth = hullWidth;
    shader.uniforms.outlineScale = hullScale;
    shader.vertexShader = "uniform float outlineWidth;\nuniform vec3 outlineScale;\n" + shader.vertexShader.replace(
      "#include <begin_vertex>",
      "#include <begin_vertex>\n  transformed += normal * outlineWidth / outlineScale;"
    );
  };
  // Геометрия контура: вершины склеены, чтобы на углах не было разрывов.
  // В атрибут normal записывается смещение вершины: на гладкой поверхности это нормаль,
  // на остром ребре — сумма нормалей соседних граней, чтобы каждая грань сместилась на одинаковую величину.
  function hullGeometry(geo) {
    var pos = geo.attributes.position;
    // Большие модели: упрощённый контур по нормалям самой модели (быстро, но на острых рёбрах возможны разрывы)
    if (pos.count > 300000) {
      var fast = new THREE.BufferGeometry();
      fast.setAttribute("position", pos);
      fast.setAttribute("normal", geo.attributes.normal);
      if (geo.index) fast.setIndex(geo.index);
      return fast;
    }
    var map = {}, verts = [], remap = new Array(pos.count), i, j;
    for (i = 0; i < pos.count; i++) {
      var x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
      var key = Math.round(x * 1000) + "," + Math.round(y * 1000) + "," + Math.round(z * 1000);
      if (!(key in map)) { map[key] = verts.length / 3; verts.push(x, y, z); }
      remap[i] = map[key];
    }
    var idx = [];
    if (geo.index) for (i = 0; i < geo.index.count; i++) idx.push(remap[geo.index.getX(i)]);
    else for (i = 0; i < pos.count; i++) idx.push(remap[i]);

    var n = verts.length / 3;
    var clusters = [];
    for (i = 0; i < n; i++) clusters.push([]);
    var a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
    var COS_SHARP = Math.cos(30 * Math.PI / 180);
    for (i = 0; i < idx.length; i += 3) {
      a.fromArray(verts, idx[i] * 3);
      b.fromArray(verts, idx[i + 1] * 3);
      c.fromArray(verts, idx[i + 2] * 3);
      var fn = new THREE.Vector3().subVectors(c, b).cross(new THREE.Vector3().subVectors(a, b));
      if (fn.lengthSq() < 1e-12) continue;
      fn.normalize();
      for (var k = 0; k < 3; k++) {
        var list = clusters[idx[i + k]], found = false;
        for (j = 0; j < list.length; j++) {
          if (list[j].clone().normalize().dot(fn) > COS_SHARP) { list[j].add(fn); found = true; break; }
        }
        if (!found) list.push(fn.clone());
      }
    }
    var disp = new Float32Array(n * 3);
    for (i = 0; i < n; i++) {
      var d = new THREE.Vector3();
      clusters[i].forEach(function (v) { d.add(v.clone().normalize()); });
      disp[i * 3] = d.x; disp[i * 3 + 1] = d.y; disp[i * 3 + 2] = d.z;
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(verts, 3));
    g.setAttribute("normal", new THREE.BufferAttribute(disp, 3));
    g.setIndex(idx);
    return g;
  }

  function select(obj) {
    if (active) active.userData.hull.visible = false;
    active = obj || null;
    if (active) active.userData.hull.visible = true;
    document.getElementById("obj-actions").hidden = !active;
    // Инструмент поворота или масштаба переходит на новый выделенный объект; без выделения — выключается
    if (tc) { if (active && tool) tc.attach(active); else setTool(null); }
    updateInfo();
  }

  function addObject(type, x, y) {
    var shape = SHAPES[type];
    if (!shape) return null;
    return addMesh(shape.make(), null, x, y, type);
  }

  // Добавление любой геометрии на стол: простой фигуры, загруженной модели или копии
  function addMesh(geo, name, x, y, nameKey) {
    // Сдвиг геометрии: центр объекта в начале координат, вокруг него идут поворот и масштаб
    geo.computeBoundingBox();
    var bb = geo.boundingBox;
    geo.translate(-(bb.min.x + bb.max.x) / 2, -(bb.min.y + bb.max.y) / 2, -(bb.min.z + bb.max.z) / 2);
    geo.computeBoundingBox();
    var triangles = Math.floor((geo.index ? geo.index.count : geo.attributes.position.count) / 3);
    var mesh = new THREE.Mesh(geo, objMat);
    // Рёбра рисуются только у не слишком больших моделей, чтобы не замедлять загрузку
    if (triangles <= 300000) mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 30), edgeMat));
    var hull = new THREE.Mesh(hullGeometry(geo), hullMat);
    hull.visible = false;
    mesh.add(hull);
    mesh.userData.hull = hull;
    mesh.userData.triangles = triangles;
    mesh.userData.name = name;
    mesh.userData.nameKey = nameKey || null; // у простых фигур имя переводится при смене языка
    mesh.position.set(x === undefined ? CENTER.x : x, y === undefined ? CENTER.y : y, 0);
    settle(mesh);
    updateCameraRange(mesh);
    scene.add(mesh);
    objects.push(mesh);
    select(mesh);
    return mesh;
  }

  function removeObject(obj) {
    var i = objects.indexOf(obj);
    if (i < 0) return;
    objects.splice(i, 1);
    scene.remove(obj);
    obj.traverse(function (o) { if (o.geometry) o.geometry.dispose(); });
    if (active === obj) select(null); else updateInfo();
    updateCameraRange();
  }

  // Точные габариты объекта с учётом поворота и масштаба (по всем вершинам)
  var _v = new THREE.Vector3();
  // Габариты запоминаются до следующего поворота или масштаба: при перемещении пересчёт не нужен
  function worldBox(obj) {
    obj.updateMatrixWorld(true);
    var key = obj.quaternion.toArray().join(",") + "|" + obj.scale.toArray().join(",");
    var cache = obj.userData.boxCache;
    if (!cache || cache.key !== key) {
      var box = new THREE.Box3();
      var pos = obj.geometry.attributes.position;
      for (var i = 0; i < pos.count; i++) box.expandByPoint(_v.fromBufferAttribute(pos, i).applyMatrix4(obj.matrixWorld));
      box.min.sub(obj.position);
      box.max.sub(obj.position);
      cache = obj.userData.boxCache = { key: key, rel: box };
    }
    return cache.rel.clone().translate(obj.position);
  }
  // Объект опускается на стол (нижняя точка на высоте 0) и не выходит за края стола
  function settle(obj) {
    var box = worldBox(obj);
    var cx = (box.min.x + box.max.x) / 2, cy = (box.min.y + box.max.y) / 2;
    var nx = clampAxis(cx, (box.max.x - box.min.x) / 2, BED.x);
    var ny = clampAxis(cy, (box.max.y - box.min.y) / 2, BED.y);
    obj.position.x += nx - cx;
    obj.position.y += ny - cy;
    obj.position.z -= box.min.z;
    updateFit(obj);
  }
  // Проверка, помещается ли объект на стол; если нет — он окрашивается предупреждающим цветом
  function updateFit(obj) {
    var b = worldBox(obj), eps = 0.01;
    var outside = b.min.x < -eps || b.min.y < -eps || b.max.x > BED.x + eps || b.max.y > BED.y + eps;
    obj.userData.outside = outside;
    obj.material = outside ? warnMat : objMat;
  }
  // Дальность камеры подстраивается под самый большой объект, чтобы он не обрезался
  function updateCameraRange() {
    var ext = Math.max(BED.x, BED.y);
    objects.forEach(function (o) {
      var s = worldBox(o).getSize(new THREE.Vector3());
      ext = Math.max(ext, s.x, s.y, s.z);
    });
    camera.far = Math.max(5000, ext * 10);
    camera.near = Math.max(0.5, camera.far / 20000);
    camera.updateProjectionMatrix();
    controls.maxDistance = Math.max(4000, ext * 6);
  }

  // Информационная панель
  function fmt(n) {
    var v = Math.round(n * 100) / 100;
    if (v === 0) v = 0; // без «-0»
    return numFmt.format(v);
  }
  function objName(o) { return o.userData.nameKey ? tr(o.userData.nameKey) : o.userData.name; }
  function updateInfo() {
    document.getElementById("bed-size").textContent = fmt(BED.x) + " × " + fmt(BED.y) + " " + tr("mm");
    var last = active;
    if (!last) {
      document.getElementById("obj-name").textContent = objects.length ? tr("notSel", { n: objects.length }) : tr("none");
      document.getElementById("obj-size").textContent = "—";
      document.getElementById("obj-pos").textContent = "—";
      document.getElementById("obj-rot").textContent = "—";
      document.getElementById("obj-scale").textContent = "—";
      return;
    }
    var box = worldBox(last);
    var s = box.getSize(new THREE.Vector3());
    document.getElementById("obj-name").textContent = objName(last) +
      (last.userData.outside ? " — " + tr("outside") : "") +
      (objects.length > 1 ? " (" + tr("total", { n: objects.length }) + ")" : "");
    document.getElementById("obj-size").textContent = fmt(s.x) + " × " + fmt(s.y) + " × " + fmt(s.z) + " " + tr("mm");
    document.getElementById("obj-pos").textContent = "X " + fmt(box.min.x) + ", Y " + fmt(box.min.y) + ", Z " + fmt(box.min.z);
    var eu = new THREE.Euler().setFromQuaternion(last.quaternion, "XYZ");
    function deg(r) { return fmt(Math.round(THREE.MathUtils.radToDeg(r) * 10) / 10) + "°"; }
    function pct(v) { return fmt(Math.round(v * 1000) / 10); }
    document.getElementById("obj-rot").textContent = "X " + deg(eu.x) + ", Y " + deg(eu.y) + ", Z " + deg(eu.z);
    document.getElementById("obj-scale").textContent = pct(last.scale.x) + " × " + pct(last.scale.y) + " × " + pct(last.scale.z) + " %";
  }
  updateInfo();

  // Размер стола: ползунки и поля точного ввода
  function parseNum(s) {
    var v = parseFloat(String(s).replace(",", "."));
    return isFinite(v) ? Math.round(v * 10) / 10 : NaN;
  }
  function setBed(axis, v) {
    if (BED[axis] === v) return;
    BED[axis] = v;
    var oldX = CENTER.x, oldY = CENTER.y;
    rebuildBed();
    // Объекты смещаются вместе с центром стола
    var dx = CENTER.x - oldX, dy = CENTER.y - oldY;
    objects.forEach(function (o) { o.position.x += dx; o.position.y += dy; updateFit(o); });
    updateInfo();
    saveBed();
  }
  function bindAxis(axis) {
    var range = document.getElementById("bed-" + axis + "-range");
    var num = document.getElementById("bed-" + axis + "-num");
    function rangeValue(v) { return String(Math.min(Math.max(v, Number(range.min)), Number(range.max))); }
    function show(v) {
      range.value = rangeValue(v);
      num.value = String(v);
      num.classList.remove("invalid");
    }
    show(BED[axis]);
    range.addEventListener("input", function () {
      var v = Number(range.value);
      num.value = String(v);
      num.classList.remove("invalid");
      setBed(axis, v);
    });
    num.addEventListener("input", function () {
      var v = parseNum(num.value);
      if (isValidSize(v)) {
        num.classList.remove("invalid");
        range.value = rangeValue(v);
        setBed(axis, v);
      } else {
        num.classList.add("invalid");
      }
    });
    num.addEventListener("change", function () {
      var v = parseNum(num.value);
      if (!isFinite(v)) v = BED[axis];
      v = Math.min(Math.max(v, BED_LIMITS.min), BED_LIMITS.max);
      show(v);
      setBed(axis, v);
    });
  }
  bindAxis("x");
  bindAxis("y");
  if (window.innerWidth < 640) document.getElementById("bed-panel").removeAttribute("open");

  // Температуры сопла и стола, отдельно для первого слоя (°C, сохраняются в этом браузере).
  // Значения по умолчанию типичны для PLA. Будут использованы при создании G-code.
  var TEMP_LIMITS = { nozzle: [150, 300], bed: [0, 120], nozzle1: [150, 300], bed1: [0, 120] };
  var TEMPS = { nozzle: 210, bed: 60, nozzle1: 215, bed1: 65 };
  try {
    var savedTemps = JSON.parse(localStorage.getItem("slicer.temps") || "null");
    if (savedTemps) Object.keys(TEMPS).forEach(function (k) {
      var v = savedTemps[k];
      if (typeof v === "number" && v >= TEMP_LIMITS[k][0] && v <= TEMP_LIMITS[k][1]) TEMPS[k] = v;
    });
  } catch (e) {}
  function saveTemps() {
    try { localStorage.setItem("slicer.temps", JSON.stringify(TEMPS)); } catch (e) {}
  }
  function bindTemp(key) {
    var range = document.getElementById("t-" + key + "-range");
    var num = document.getElementById("t-" + key + "-num");
    var lim = TEMP_LIMITS[key];
    function parseTemp(s) { return Math.round(parseFloat(String(s).replace(",", "."))); }
    function setTemp(v) {
      TEMPS[key] = v;
      range.value = String(v);
      num.classList.remove("invalid");
      saveTemps();
    }
    range.value = num.value = String(TEMPS[key]);
    range.addEventListener("input", function () {
      num.value = range.value;
      setTemp(Number(range.value));
    });
    num.addEventListener("input", function () {
      var v = parseTemp(num.value);
      if (isFinite(v) && v >= lim[0] && v <= lim[1]) setTemp(v);
      else num.classList.add("invalid");
    });
    num.addEventListener("change", function () {
      var v = parseTemp(num.value);
      if (!isFinite(v)) v = TEMPS[key];
      v = Math.min(Math.max(v, lim[0]), lim[1]);
      num.value = String(v);
      setTemp(v);
    });
  }
  ["nozzle", "bed", "nozzle1", "bed1"].forEach(bindTemp);
  if (window.innerWidth < 640) document.getElementById("temp-panel").removeAttribute("open");

  // Меню «Добавить объект»
  var addPanel = document.getElementById("add-panel");
  var addToggle = document.getElementById("add-toggle");
  var addMenu = document.getElementById("add-menu");
  function setMenu(open) {
    addMenu.hidden = !open;
    addToggle.setAttribute("aria-expanded", open ? "true" : "false");
  }
  addToggle.addEventListener("click", function () { setMenu(addMenu.hidden); });
  Array.prototype.forEach.call(addMenu.querySelectorAll("[data-shape]"), function (b) {
    b.addEventListener("click", function () {
      addObject(b.getAttribute("data-shape"));
      setMenu(false);
    });
  });
  document.addEventListener("click", function (e) {
    if (!addMenu.hidden && !addPanel.contains(e.target)) setMenu(false);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !addMenu.hidden) { setMenu(false); addToggle.focus(); }
  });

  // Загрузка моделей из файлов: перетаскивание в окно или пункт «Открыть файл…»
  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function toast(text, isError) {
    toastEl.textContent = text;
    toastEl.className = "overlay" + (isError ? " error" : "");
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, isError ? 12000 : 7000);
  }

  var SUPPORTED_LIST = "STL, OBJ, FBX, 3MF, PLY, GLB, glTF, AMF";
  var LOADABLE = { stl: 1, obj: 1, fbx: 1, "3mf": 1, ply: 1, glb: 1, gltf: 1, amf: 1 };
  // Форматы с осью Y вверх: модель поворачивается, чтобы верх модели смотрел вверх (ось Z)
  var Y_UP = { obj: 1, fbx: 1, glb: 1, gltf: 1 };
  // Неподдерживаемые форматы: ключ сообщения с подсказкой, что делать
  var NOT_SUPPORTED = {
    blend: "mBlend", step: "mStep", stp: "mStep", iges: "mStep", igs: "mStep",
    sldprt: "mCad", sldasm: "mCad", ipt: "mCad", iam: "mCad", f3d: "mCad", f3z: "mCad",
    m3d: "mCad", a3d: "mCad", catpart: "mCad", catproduct: "mCad", prt: "mCad", asm: "mCad",
    x_t: "mCad", x_b: "mCad", sat: "mCad", skp: "mCad", "3dm": "mCad", dwg: "mCad", dxf: "mCad",
    gcode: "mGcode", zip: "mArchive", rar: "mArchive", "7z": "mArchive"
  };
  function fileExt(name) { var m = /\.([^.]+)$/.exec(name); return m ? m[1].toLowerCase() : ""; }
  function readFile(file) {
    if (file.arrayBuffer) return file.arrayBuffer();
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(r.result); };
      r.onerror = function () { reject(r.error); };
      r.readAsArrayBuffer(file);
    });
  }
  // glTF/GLB: цвета и текстуры не нужны, а их загрузка в защищённой странице может сорвать чтение всей модели.
  // Поэтому материалы, текстуры и изображения удаляются из файла до разбора.
  function stripGltf(buf) {
    var bytes = new Uint8Array(buf);
    var isGlb = bytes.length >= 12 && bytes[0] === 0x67 && bytes[1] === 0x6C && bytes[2] === 0x54 && bytes[3] === 0x46;
    var json, bin = null, dv = new DataView(buf);
    if (isGlb) {
      var jsonLen = dv.getUint32(12, true);
      json = JSON.parse(new TextDecoder().decode(bytes.subarray(20, 20 + jsonLen)));
      var off = 20 + jsonLen;
      if (off + 8 <= bytes.length) {
        var binLen = dv.getUint32(off, true);
        bin = bytes.subarray(off + 8, off + 8 + binLen);
      }
    } else {
      json = JSON.parse(new TextDecoder().decode(bytes));
    }

    document.title = tr("title");
    setNumberFormats();
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (el) {
      el.textContent = tr(el.getAttribute("data-i18n"));
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-title]"), function (el) {
      el.title = tr(el.getAttribute("data-i18n-title"));
    });
    document.getElementById("bed-summary").textContent = tr("bed") + ", " + tr("mm");
    ["x", "y"].forEach(function (a) {
      var name = tr(a === "x" ? "width" : "length") + " (" + a.toUpperCase() + ")";
      setAttr("bed-" + a + "-range", "aria-label", name + ", " + tr("slider"));
      setAttr("bed-" + a + "-num", "aria-label", name + ", " + tr("mm"));
    });
    [["nozzle", "nozzle", false], ["bed", "bed", false], ["nozzle1", "nozzle", true], ["bed1", "bed", true]].forEach(function (r) {
      var name = tr(r[1]) + (r[2] ? ", " + tr("firstLayerShort") : "");
      setAttr("t-" + r[0] + "-range", "aria-label", name + ", " + tr("slider"));
      setAttr("t-" + r[0] + "-num", "aria-label", name + ", °C");
      var lab = document.querySelector('label[for="t-' + r[0] + '-num"]');
      if (lab) lab.title = name;
    });
    addToggle.textContent = tr("add") + " \u25be";
    document.querySelector('[data-tool="rotate"]').textContent = tr("rotate") + " (R)";
    document.querySelector('[data-tool="scale"]').textContent = tr("scale") + " (S)";
    setAttr("lang-select", "aria-label", tr("language"));
    setAttr("lang-label", "title", tr("language"));
    if (statusEl.className === "") statusEl.textContent = tr("loading");
    updateHint();
    updateToolLabel();
    updateInfo();
  }
  var langSelect = document.getElementById("lang-select");
  I18N_ORDER.forEach(function (code) {
    var o = document.createElement("option");
    o.value = code;
    o.textContent = I18N[code].langName;
    langSelect.appendChild(o);
  });
  langSelect.value = i18n.lang;
  langSelect.addEventListener("change", function () {
    if (!I18N[langSelect.value]) return;
    i18n.lang = langSelect.value;
    try { localStorage.setItem("slicer.lang", i18n.lang); } catch (e) {}
    applyLang();
    langSelect.blur(); // чтобы клавиши R, S и Delete снова работали сразу после выбора
  });
  applyLang();
})();
</script>
</body>
</html>
